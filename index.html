<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuma - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Space Grotesk', system-ui, sans-serif; background-color: #050505; }
        body, .glass-card, button, div, span, p, h1, h2, a, i, input { transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1); }

        body.light-theme { background-color: #f1f5f9; color: #1e293b; }
        body.light-theme .glass-card { background: rgba(255, 255, 255, 0.9); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
        body.light-theme .bg-grid { background-image: linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px); }
        body.light-theme .main-logo { filter: invert(1) brightness(0.2); }
        body.light-theme #customLangBtn, body.light-theme #logoutBtn { background-color: #ffffff; border-color: #cbd5e1; color: #334155; }
        body.light-theme #logoutBtn:hover { background-color: #fee2e2; color: #ef4444; }
        body.light-theme .text-zinc-100, body.light-theme .text-zinc-200, body.light-theme .text-zinc-300 { color: #1e293b !important; }
        body.light-theme .text-zinc-400, body.light-theme .text-zinc-500 { color: #64748b !important; }
        body.light-theme input { background-color: #ffffff !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        body.light-theme .lang-option { color: #334155; }
        body.light-theme .lang-option:hover { background-color: #f1f5f9; }
        body.light-theme #closeLangModalBtn { color: #64748b; }
        body.light-theme #closeLangModalBtn:hover { color: #1e293b; }

        #themeToggle { background-color: #27272a; }
        #themeThumb { transform: translateX(4px); }
        body.light-theme #themeToggle { background-color: #cbd5e1; border-color: #94a3b8; }
        body.light-theme #themeThumb { transform: translateX(32px); background-color: #ffffff; }

        .glass-card { background: rgba(30, 30, 35, 0.6); border-radius: 1.25rem; position: relative; overflow: hidden; box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
        .glass-card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 2px; background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), #ef4444 0%, #f97316 40%, #eab308 70%, transparent 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
        .glass-card:hover::after { opacity: 1; }

        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 30%, transparent 80%); }

        .tab-btn { color: #a1a1aa; white-space: nowrap; position: relative; padding-bottom: 12px; font-weight: 600; font-size: 0.875rem; }
        .tab-btn.active { color: #f97316; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #f97316, #ef4444); border-radius: 3px; }

        .order-card { border-left: 5px solid #ccc; }
        .order-card.status-pending { border-left-color: #f97316; }
        .order-card.status-in_progress { border-left-color: #38bdf8; }
        .order-card.status-ready_delivery { border-left-color: #22c55e; }
        .order-card.status-completed { border-left-color: #94a3b8; }
        .order-card.status-rejected { border-left-color: #ef4444; }

        /* Toast Animations */
        .toast-enter { transform: translateY(-20px); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; }
        .toast-leave { transform: translateX(100%); opacity: 0; }
    </style>
</head>
<body class="text-zinc-300 min-h-screen relative z-0">
    <div class="fixed inset-0 z-[-1] pointer-events-none"><div class="absolute inset-0 bg-grid"></div></div>

    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <div id="login-screen" class="min-h-screen flex flex-col justify-center items-center px-4">
        <div class="glass-card bg-zinc-900/80 p-8 w-full max-w-md text-center space-y-6">
            <img class="h-14 mx-auto main-logo" src="https://raw.githubusercontent.com/yumafergana/yuma-images/main/yuma-logo.png" alt="Yuma Logo">
            <h2 class="text-2xl font-bold text-zinc-100">Yuma Control</h2>
            <form id="loginForm" class="space-y-4 text-left">
                <input type="email" id="loginEmail" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-orange-500" placeholder="Email" required>
                <input type="password" id="loginPassword" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-orange-500" placeholder="Пароль" required>
                <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-90">Войти</button>
            </form>
        </div>
    </div>

    <div id="admin-screen" class="hidden">
        <header class="glass-card m-4 p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <img class="h-10 main-logo" src="https://raw.githubusercontent.com/yumafergana/yuma-images/main/yuma-logo.png" alt="Yuma Logo">
                <span class="text-orange-500 font-bold text-sm tracking-widest border-l border-white/10 pl-4 hidden sm:inline">ADMIN PANEL</span>
            </div>
            <div class="flex items-center gap-3 sm:gap-4">
                <button id="themeToggle" type="button" class="relative inline-flex h-7 w-14 items-center rounded-full border border-white/10 transition-colors focus:outline-none cursor-pointer">
                    <span class="absolute inset-0 flex items-center justify-between px-1.5 pointer-events-none">
                        <i class="fa-solid fa-moon text-[11px] text-zinc-400"></i>
                        <i class="fa-solid fa-sun text-[11px] text-yellow-500"></i>
                    </span>
                    <span id="themeThumb" class="inline-block h-5 w-5 rounded-full bg-white transition duration-300 ease-in-out z-10 shadow-sm"></span>
                </button>
                
                <div class="relative inline-block text-left select-none">
                    <button id="customLangBtn" type="button" class="bg-zinc-800 text-zinc-200 text-sm px-4 py-2 rounded-xl border border-white/10 font-bold flex items-center gap-2 hover:bg-zinc-700/50 transition">
                        <span id="currentLangText">Русский</span>
                        <i class="fa-solid fa-globe text-xs text-zinc-400"></i>
                    </button>
                </div>

                <button id="logoutBtn" class="text-sm font-bold text-zinc-300 bg-zinc-800 border border-white/10 px-3 py-2 rounded-xl hover:bg-zinc-700 transition">
                    <i class="fa-solid fa-power-off"></i> <span class="hidden sm:inline">Выйти</span>
                </button>
            </div>
        </header>

        <div class="mx-4 mb-4 overflow-x-auto flex gap-6 px-2 border-b border-white/10" id="tabsContainer">
            <button class="tab-btn active" data-status="pending">Ожидают</button>
            <button class="tab-btn" data-status="in_progress">Готовка</button>
            <button class="tab-btn" data-status="ready_delivery">В пути</button>
            <button class="tab-btn" data-status="completed">Завершенные</button>
            <button class="tab-btn" data-status="rejected">Отказанные</button>
            <button class="tab-btn" data-status="all">Все</button>
        </div>

        <main class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 p-4" id="ordersGrid"></main>
    </div>

    <div id="langModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-[100] p-4 transition-all duration-300 opacity-0 backdrop-blur-sm">
        <div id="langModalContent" class="glass-card p-6 w-full max-w-xs transform scale-95 transition-all duration-300 relative">
            <button id="closeLangModalBtn" class="absolute top-4 right-4 text-zinc-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-lg font-bold text-white mb-4 pr-6 select-none">Language / Язык</h3>
            <div class="space-y-1">
                <div data-lang="ru" class="lang-option px-4 py-3 text-sm font-semibold text-zinc-200 hover:bg-white/5 rounded-xl cursor-pointer flex items-center justify-between transition select-none">
                    <span>Русский</span>
                    <i class="fa-solid fa-check text-xs text-orange-500 hidden" data-check="ru"></i>
                </div>
                <div data-lang="uz" class="lang-option px-4 py-3 text-sm font-semibold text-zinc-200 hover:bg-white/5 rounded-xl cursor-pointer flex items-center justify-between transition select-none">
                    <span>O'zbekcha</span>
                    <i class="fa-solid fa-check text-xs text-orange-500 hidden" data-check="uz"></i>
                </div>
                <div data-lang="en" class="lang-option px-4 py-3 text-sm font-semibold text-zinc-200 hover:bg-white/5 rounded-xl cursor-pointer flex items-center justify-between transition select-none">
                    <span>English</span>
                    <i class="fa-solid fa-check text-xs text-orange-500 hidden" data-check="en"></i>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // --- СИСТЕМА УВЕДОМЛЕНИЙ (TOASTS) ---
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = '';
            let borderClass = '';
            if(type === 'success') { icon = '<i class="fa-solid fa-circle-check text-green-500 text-xl"></i>'; borderClass = 'border-l-4 border-green-500'; }
            else if(type === 'error') { icon = '<i class="fa-solid fa-circle-xmark text-red-500 text-xl"></i>'; borderClass = 'border-l-4 border-red-500'; }
            else { icon = '<i class="fa-solid fa-circle-exclamation text-orange-500 text-xl"></i>'; borderClass = 'border-l-4 border-orange-500'; }

            toast.className = `glass-card p-4 flex items-center gap-3 text-zinc-100 shadow-2xl pointer-events-auto toast-enter ${borderClass}`;
            toast.innerHTML = `${icon} <span class="font-medium text-sm sm:text-base">${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-active');
                toast.classList.add('toast-leave');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        };

        // XSS Утилита: Экранирование HTML тегов
        const escapeHTML = (str) => {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, match => {
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return escapeMap[match];
            });
        };

        const firebaseConfig = {
            apiKey: "AIzaSyBR3rLYp-cpq9nYsDKwwdbTziLr1w0qxn8",
            authDomain: "jwiidid.firebaseapp.com",
            databaseURL: "https://jwiidid-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "jwiidid",
            storageBucket: "jwiidid.firebasestorage.app",
            messagingSenderId: "163956366428",
            appId: "1:163956366428:web:d209e93e59eeada258da99"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Динамический словарь блюд, который заполнится данными из Firebase
        let dishes = [];

        const adminTranslations = {
            ru: { pending: "Ожидают принятия", in_progress: "В процессе готовки", ready_delivery: "В пути / Ждут", completed: "Завершенные", rejected: "Отказанные", all: "Все за все время", order: "Заказ", type: "Тип", sum: "Итого", accept: "Принять", progress: "На кухню", ready: "Готов/В путь", complete: "Завершить", reject: "Отклонить", pickup: "🚶 Самовывоз", delivery: "🚗 Доставка" },
            uz: { pending: "Kutilmoqda", in_progress: "Tayyorlanmoqda", ready_delivery: "Yo'lda / Tayyor", completed: "Yakunlandi", rejected: "Rad etildi", all: "Barchasi", order: "Buyurtma", type: "Turi", sum: "Jami", accept: "Qabul qilish", progress: "Oshxonaga", ready: "Yo'lga / Tayyor", complete: "Yakunlash", reject: "Rad etish", pickup: "🚶 Olib ketish", delivery: "🚗 Yetkazib berish" },
            en: { pending: "Pending", in_progress: "In Progress", ready_delivery: "Ready / Delivery", completed: "Completed", rejected: "Rejected", all: "All History", order: "Order", type: "Type", sum: "Total", accept: "Accept", progress: "To Kitchen", ready: "Ready/Dispatch", complete: "Complete", reject: "Reject", pickup: "🚶 Pickup", delivery: "🚗 Delivery" }
        };

        const langNames = { ru: "Русский", uz: "O'zbekcha", en: "English" };
        let currentLang = localStorage.getItem('admin_lang') || 'ru';
        let currentFilter = 'pending';
        let globalOrders = {};

        function initTheme() {
            const savedTheme = localStorage.getItem('yuma_theme');
            if (savedTheme === 'light') { document.body.classList.add('light-theme'); } 
            else if (savedTheme === 'dark') { document.body.classList.remove('light-theme'); } 
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) { document.body.classList.add('light-theme'); }
        }
        initTheme();

        document.getElementById('themeToggle').addEventListener('click', () => {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('yuma_theme', isLight ? 'light' : 'dark');
        });

        // --- ЛОГИКА КАСТОМНОГО ОКНА ВЫБОРА ЯЗЫКА ---
        const customLangBtn = document.getElementById('customLangBtn');
        const langModal = document.getElementById('langModal');
        const langModalContent = document.getElementById('langModalContent');
        const closeLangModalBtn = document.getElementById('closeLangModalBtn');

        function openLangModal() {
            langModal.classList.remove('hidden');
            setTimeout(() => {
                langModal.classList.remove('opacity-0');
                langModal.classList.add('opacity-100');
                langModalContent.classList.remove('scale-95');
                langModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeLangModal() {
            langModal.classList.remove('opacity-100');
            langModal.classList.add('opacity-0');
            langModalContent.classList.remove('scale-100');
            langModalContent.classList.add('scale-95');
            setTimeout(() => langModal.classList.add('hidden'), 300);
        }

        customLangBtn.addEventListener('click', openLangModal);
        closeLangModalBtn.addEventListener('click', closeLangModal);
        
        langModal.addEventListener('click', (e) => {
            if (e.target === langModal) closeLangModal();
        });

        document.querySelectorAll('.lang-option').forEach(option => {
            option.addEventListener('click', () => {
                currentLang = option.getAttribute('data-lang');
                localStorage.setItem('admin_lang', currentLang);
                translateInterface();
                renderOrders();
                closeLangModal();
            });
        });

        // Управление состоянием входа через Firebase
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
                translateInterface();
                loadMenuAndOrders(); // Сначала грузим меню, внутри него запустятся заказы
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('admin-screen').classList.add('hidden');
                document.getElementById('ordersGrid').innerHTML = '';
            }
        });

        // Обработка формы входа
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerText = "Вход...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('Успешный вход!', 'success');
            } catch (error) {
                showToast('Ошибка входа. Неверный логин или пароль.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = "Войти";
            }
        });

        // Выход
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                showToast('Вы вышли из системы', 'info');
            });
        });

        // --- СИНХРОНИЗАЦИЯ БАЗЫ ДАННЫХ ---
        function loadMenuAndOrders() {
            // Слушаем изменения в меню (Firebase ref('menu'))
            onValue(ref(db, 'menu'), (snap) => {
                const data = snap.val() || {};
                // Преобразуем объект Firebase в сопоставимый формат
                dishes = Object.keys(data).map(key => ({
                    id: key,
                    c: data[key].category,
                    p: Number(data[key].price),
                    i: data[key].image,
                    t: {
                        uz: data[key].name_uz,
                        ru: data[key].name_ru,
                        en: data[key].name_en
                    }
                }));

                // Как только меню загружено/обновлено, подтягиваем и перерисовываем заказы
                loadOrdersData();
            });
        }

        function loadOrdersData() {
            onValue(ref(db, 'orders'), (snap) => {
                globalOrders = snap.val() || {};
                renderOrders();
            });
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            grid.innerHTML = '';
            const t = adminTranslations[currentLang];

            Object.keys(globalOrders).sort((a,b) => globalOrders[b].timestamp - globalOrders[a].timestamp).forEach(key => {
                const order = globalOrders[key];
                if(currentFilter !== 'all' && order.status !== currentFilter) return;

                const isDelivery = order.deliveryType === 'delivery';
                
                // РАСЧЕТ СУММЫ НА ОСНОВЕ ДАННЫХ ИЗ FIREBASE
                let realTotal = isDelivery ? 10000 : 0;

                const itemsHtml = order.items.map(i => {
                    const dish = dishes.find(d => d.id === i.id); // Ищем по строковому ID Firebase
                    if (dish) realTotal += dish.p * i.qty; 
                    
                    const displayName = dish ? escapeHTML(dish.t[currentLang]) : "Неизвестный товар";
                    const safeQty = escapeHTML(i.qty);

                    return `<li class="text-sm text-zinc-300 font-medium py-1 border-b border-white/5 last:border-0">
                        ${displayName} <span class="float-right text-orange-400 font-bold">x${safeQty}</span>
                    </li>`;
                }).join('');

                let buttonsHtml = '';
                const safeKey = escapeHTML(key);
                
                if (order.status === 'pending') {
                    buttonsHtml = `<button onclick="window.updateOrderStatus('${safeKey}', 'in_progress')" class="flex-1 bg-lime-500 text-black font-bold py-2.5 rounded-xl">${t.accept}</button>
                                   <button onclick="window.updateOrderStatus('${safeKey}', 'rejected')" class="bg-red-500 text-white font-bold py-2.5 px-4 rounded-xl">${t.reject}</button>`;
                } else if (order.status === 'in_progress') {
                    buttonsHtml = `<button onclick="window.updateOrderStatus('${safeKey}', 'ready_delivery')" class="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl">${t.ready}</button>`;
                } else if (order.status === 'ready_delivery') {
                    buttonsHtml = `<button onclick="window.updateOrderStatus('${safeKey}', 'completed')" class="w-full bg-zinc-600 text-white font-bold py-3 rounded-xl">${t.complete}</button>`;
                }

                const safeId = escapeHTML(order.id);
                const safeDate = escapeHTML(order.dateStr);
                const safeName = escapeHTML(order.clientName);
                const safePhone = escapeHTML(order.clientPhone);
                const safeAddress = escapeHTML(order.address);
                const safeStatus = escapeHTML(order.status);

                grid.innerHTML += `
                    <div class="glass-card p-6 order-card status-${safeStatus}" onmousemove="window.trackMouse(event, this)">
                        <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                            <span class="font-black text-lg">${safeId}</span>
                            <span class="text-xs text-zinc-400 font-semibold">${safeDate}</span>
                        </div>
                        <div class="mb-4">
                            <div class="font-bold text-zinc-100"><i class="fa-solid fa-user text-orange-400 mr-2"></i>${safeName}</div>
                            <a href="tel:${safePhone}" class="text-sm text-zinc-400"><i class="fa-solid fa-phone text-sky-400 mr-2"></i>${safePhone}</a>
                        </div>
                        <div class="bg-black/30 rounded-xl p-4 mb-4">
                             <div class="text-xs font-bold text-zinc-500 uppercase mb-2">${isDelivery ? t.delivery : t.pickup}</div>
                             ${isDelivery ? `<div class="text-sm text-red-400 mb-2">${safeAddress}</div>` : ''}
                             <ul>${itemsHtml}</ul>
                        </div>
                        <div class="text-right text-lg font-black mb-4">
                            ${t.sum}: <span class="text-orange-500">${realTotal.toLocaleString('ru-RU')} сум</span>
                        </div>
                        <div class="flex gap-3">${buttonsHtml}</div>
                    </div>`;
            });
        }

        window.trackMouse = (e, el) => {
            const rect = el.getBoundingClientRect();
            el.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            el.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        };

        window.updateOrderStatus = (key, newStatus) => {
            update(ref(db, 'orders/' + key), { status: newStatus })
                .then(() => showToast('Статус заказа обновлен', 'success'))
                .catch(() => showToast('Ошибка при обновлении статуса', 'error'));
        };

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-status');
                renderOrders();
            });
        });

        function translateInterface() {
            const t = adminTranslations[currentLang];
            
            // Обновляем текст на кнопке языка
            document.getElementById('currentLangText').innerText = langNames[currentLang];

            // Переключаем активные галочки во всплывающем модальном окне
            document.querySelectorAll('[data-check]').forEach(el => {
                if(el.getAttribute('data-check') === currentLang) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });

            // Обновляем названия табов фильтрации
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const status = btn.getAttribute('data-status');
                if(t[status]) btn.innerText = t[status];
            });
        }
    </script>
</body>
</html>
